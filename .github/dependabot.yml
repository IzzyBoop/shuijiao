version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks before proposing a new release: most malicious publishes are caught by then.
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1; remove this once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
