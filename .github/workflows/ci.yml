name: CI and deploy

# Every push and pull request is checked. Students only get a new version when a release
# tag (v2026.11.21, made by tools/release.sh) is pushed, or when it is deployed by hand from the
# Actions tab ("Run workflow"), which can also ship the service-worker kill switch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      kill_switch:
        description: 'Emergency: replace the service worker with tools/sw-kill-switch.js (see SECURITY.md)'
        type: boolean
        default: false

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (install scripts disabled by .npmrc)
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit signatures

      - name: Check commit metadata (no personal emails, UTC only)
        run: tools/check-commits.sh

      - name: Scan full history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
          rm -f gitleaks gitleaks.tar.gz

      - name: Lint, typecheck, format, unit tests
        run: npm run check

      - name: Build (includes leak and CSP check of dist/)
        run: npm run build

      - name: End-to-end tests against the production build
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Swap in the service-worker kill switch
        if: github.event_name == 'workflow_dispatch' && inputs.kill_switch
        run: cp tools/sw-kill-switch.js dist/sw.js

      - name: Upload site for GitHub Pages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
